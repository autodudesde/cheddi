<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Module" />
<f:section name="Content">
    <f:if condition="{enabled}">
        <f:then>
            <f:be.infobox
                state="-1"
                title="{f:translate(key: 'LLL:EXT:cheddi/Resources/Private/Language/locallang_mod.xlf:notice.reload.title')}"
                message="{f:translate(key: 'LLL:EXT:cheddi/Resources/Private/Language/locallang_mod.xlf:notice.reload.message')}"
            />
        </f:then>
        <f:else>
            <f:be.infobox
                state="-1"
                title="{f:translate(key: 'LLL:EXT:cheddi/Resources/Private/Language/locallang_mod.xlf:notice.disabled.title')}"
                message="{f:translate(key: 'LLL:EXT:cheddi/Resources/Private/Language/locallang_mod.xlf:notice.disabled.message')}"
            />
        </f:else>
    </f:if>
</f:section>
</html>
